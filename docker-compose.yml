services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentplane
      POSTGRES_PASSWORD: agentplane
      POSTGRES_DB: agentplane
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentplane"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://agentplane:agentplane@postgres:5432/agentplane
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/data:/app/data:ro

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:

